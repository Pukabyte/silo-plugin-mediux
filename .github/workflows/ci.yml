name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Verify source and modules
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
      - name: Test, vet and audit
        run: make check audit
      - name: Build install archive
        run: python3 tools/package.py --platform linux/amd64
      - name: Verify reproducible archive
        run: |
          python3 tools/package.py --platform linux/amd64 --output "$RUNNER_TEMP/mediux-repeat"
          version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          cmp "dist/$version/silo-plugin-mediux-$version-linux-amd64.zip" "$RUNNER_TEMP/mediux-repeat/silo-plugin-mediux-$version-linux-amd64.zip"
      - name: Native runtime smoke check
        run: |
          version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          go run ./tools/smoke "$(pwd)/dist/$version/plugin-linux-amd64" "$version"

  settings:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Prepare existing browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/mediux-ui" --no-save --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/mediux-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check settings page
        env:
          NODE_PATH: ${{ runner.temp }}/mediux-ui/node_modules
        run: node tests/settings-ui.test.cjs
