<!doctype html>
<html lang="en" data-theme="midnight-cinema">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark">
  <title>Artwork Manager</title><link rel="stylesheet" href="ui.css">
  {{THEME}}
  <style>
    :root{color-scheme:dark;--background:#141417;--foreground:#e8e8ec;--card:#1c1c20;--border:#303038;--radius:.75rem;font-family:var(--font-body,Outfit),system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--background);color:var(--foreground);font:400 .9375rem/1.5 var(--font-body,Outfit),system-ui,sans-serif}.artwork-manager{max-width:1280px;margin:auto;padding:2rem 1.5rem 3rem}.artwork-shell-header{display:flex;align-items:start;justify-content:space-between;gap:1rem;margin-bottom:1rem}.artwork-shell-header h1,.artwork-shell-header p{margin:0}.artwork-shell-header h1{font-size:1.8rem;line-height:1.2;letter-spacing:-.03em}.artwork-shell-header p{color:var(--muted-foreground);margin-top:.35rem}.artwork-links{display:flex;gap:.5rem;flex-wrap:wrap}.artwork-links a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.5rem .65rem;border:1px solid var(--border);border-radius:.5rem;color:var(--foreground);text-decoration:none}.artwork-tabs{display:flex;gap:.5rem;border-bottom:1px solid var(--border);margin-bottom:1rem}.artwork-tabs button{position:relative;min-height:44px;padding:.5rem .75rem;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--foreground);font:inherit;font-weight:600;cursor:pointer}.artwork-tabs button[aria-selected="true"]{border-bottom-color:var(--settings-accent,#a78bfa);color:#fff}.artwork-tabs button:focus-visible,.artwork-links a:focus-visible{outline:3px solid color-mix(in srgb,var(--settings-accent,#a78bfa) 55%,transparent);outline-offset:2px}.artwork-view[hidden]{display:none!important}@media(max-width:640px){.artwork-manager{padding:1.25rem 1rem 2rem}.artwork-shell-header{display:block}.artwork-links{margin-top:1rem}.artwork-links a{flex:1}.artwork-tabs{overflow:auto}.artwork-tabs button{white-space:nowrap}}
  </style>
  <style id="media-component-style">{{MEDIA_STYLE}}</style>
  <style id="collections-component-style">{{COLLECTIONS_STYLE}}</style>
</head>
<body><main class="artwork-manager">
  <header class="artwork-shell-header"><div><h1>Artwork Manager</h1><p>Browse Mediux artwork for movies, shows, and collection covers.</p></div><nav class="artwork-links" aria-label="Artwork Manager links"><a href="settings">Artwork settings</a><a href="/admin/plugins">Back to Silo</a></nav></header>
  <div class="artwork-tabs" role="tablist" aria-label="Artwork Manager views"><button id="tab-media" type="button" role="tab" aria-selected="true" aria-controls="media-view">Movies &amp; shows</button><button id="tab-collections" type="button" role="tab" aria-selected="false" aria-controls="collections-view" tabindex="-1">Collection covers</button></div>
  <section id="media-view" class="artwork-view" data-artwork-panel role="tabpanel" aria-labelledby="tab-media">{{MEDIA_CONTENT}}</section>
  <section id="collections-view" class="artwork-view" data-artwork-panel role="tabpanel" aria-labelledby="tab-collections" hidden>{{COLLECTIONS_CONTENT}}</section>
</main>
{{MEDIA_SCRIPT}}
{{COLLECTIONS_SCRIPT}}
<script>
(()=>{"use strict";const tabs=[document.getElementById("tab-media"),document.getElementById("tab-collections")],views=[document.getElementById("media-view"),document.getElementById("collections-view")],names=["media","collections"],path=location.pathname.replace(/\/+$/,"");let initial=new URL(location.href).searchParams.get("view");if(path.endsWith("/collections"))initial="collections";if(path.endsWith("/sets"))initial="media";if(initial!=="collections")initial="media";function select(view,write){const index=names.indexOf(view);tabs.forEach((tab,i)=>{const active=i===index;tab.setAttribute("aria-selected",String(active));tab.tabIndex=active?0:-1;views[i].hidden=!active});document.querySelectorAll("#media-view dialog[open],#collections-view dialog[open]").forEach(dialog=>dialog.close());if(write){const base=location.pathname.replace(/\/(?:artwork|sets|collections)$/,"");const params=new URLSearchParams();params.set("view",view);const collection=new URL(location.href).searchParams.get("collection");if(view==="collections"&&collection)params.set("collection",collection);history.replaceState(null,"",base+"/artwork?"+params.toString())}window.dispatchEvent(new CustomEvent("artwork:view",{detail:view}));}tabs.forEach((tab,index)=>{tab.addEventListener("click",()=>select(names[index],true));tab.addEventListener("keydown",event=>{let next=index;if(event.key==="ArrowRight"||event.key==="ArrowDown")next=(index+1)%tabs.length;else if(event.key==="ArrowLeft"||event.key==="ArrowUp")next=(index+tabs.length-1)%tabs.length;else if(event.key==="Home")next=0;else if(event.key==="End")next=tabs.length-1;else return;event.preventDefault();tabs[next].focus();select(names[next],true)})});select(initial,false)})();
</script></body></html>
